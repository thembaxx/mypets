name: Original-image reconstruction source preparation
on:
  push:
    branches: [feat/image-to-3d-blender-studio-20261104]
    paths:
      - scripts/prepare-image3d-source.py
      - scripts/test_prepare_image3d_source.py
      - .github/workflows/image3d-reconstruction-sources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-all-17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image preparation dependencies
        run: python -m pip install 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5' 'Pillow>=11,<13'
      - name: Test original-image extraction
        run: python -m unittest scripts/test_prepare_image3d_source.py -v
      - name: Prepare transparent input images for all 17 originals
        run: |
          python scripts/prepare-image3d-source.py \
            --original-dir assets/animal-originals \
            --output-dir "$RUNNER_TEMP/image3d-inputs" \
            --size 1024
      - name: Reject incomplete or mislabeled source pack
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "image3d-inputs"
          entries = json.loads((root / "manifest.json").read_text())
          assert len(entries) == 17
          assert len(list(root.glob("*.png"))) == 17
          for entry in entries:
              assert entry["generated_mesh"] is False
              assert entry["source_review"] == "UNAPPROVED_NEEDS_VISUAL_INSPECTION"
              assert (root / entry["prepared_image"]).stat().st_size > 1000
          PY
      - name: Upload literal source images; NO model approvals or releases
        uses: actions/upload-artifact@v7
        with:
          name: original-illustration-image3d-inputs-17
          path: ${{ runner.temp }}/image3d-inputs/
          if-no-files-found: error
          retention-days: 14
