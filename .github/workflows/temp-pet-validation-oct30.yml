name: Temporary MyPets scoped validation
on:
  push:
    branches:
      - feat/pet-3d-motion-controls-oct30
permissions:
  contents: read
jobs:
  scoped-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show formatting of changed regression test
        run: |
          npx oxfmt --write tests/animated-vignette.test.ts
          git diff -- tests/animated-vignette.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
