name: Temporary MyPets mobile-polish formatting
on:
  push:
    branches: [ui/mobile-native-polish-20261104]
    paths:
      - .github/workflows/format-mobile-polish.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'thembaxx/mypets' && github.ref == 'refs/heads/ui/mobile-native-polish-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Format only the 3D studio accessibility fix
        run: |
          set -euo pipefail
          npx oxfmt --write components/tripo-pet.tsx
          git add -- components/tripo-pet.tsx
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format 3D studio focus fix'
            git push origin HEAD:ui/mobile-native-polish-20261104
          fi
