name: Format source-fidelity review files once
on:
  push:
    branches:
      - feat/image-to-3d-blender-studio-20261104
    paths:
      - .github/workflows/image3d-format-review-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/image-to-3d-blender-studio-20261104
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Format only changed files
        run: |
          npx oxfmt docs/image-to-3d-studio.md scripts/verify-chibi-heroes.mjs
          npx oxfmt --check docs/image-to-3d-studio.md scripts/verify-chibi-heroes.mjs
      - name: Commit exact formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/image-to-3d-studio.md scripts/verify-chibi-heroes.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(3d): format source-fidelity review files'
            git push origin HEAD:feat/image-to-3d-blender-studio-20261104
          fi
