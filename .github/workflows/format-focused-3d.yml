name: Focused 3D formatting (temporary)
on:
  push:
    branches:
      - feat/expressive-cat-tail-nov26
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Format the changed files
        run: npx --no-install oxfmt components/living-cat.tsx lib/cat-motion.ts tests/cat-motion.test.ts
      - name: Commit format-only correction to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add components/living-cat.tsx lib/cat-motion.ts tests/cat-motion.test.ts
            git commit -m 'style: format expressive calico prototype'
            git push origin HEAD:feat/expressive-cat-tail-nov26
          fi
