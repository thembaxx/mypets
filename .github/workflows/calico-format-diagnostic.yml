name: Calico formatting diagnostic (draft only)
on:
  push:
    branches:
      - feat/living-3d-pet-behaviours-20261102
    paths:
      - scripts/verify-calico-rig.mjs
      - .github/workflows/calico-format-diagnostic.yml
permissions:
  contents: read
jobs:
  print-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Show exact Oxfmt correction without changing repository
        run: |
          npx oxfmt scripts/verify-calico-rig.mjs
          git --no-pager diff -- scripts/verify-calico-rig.mjs
