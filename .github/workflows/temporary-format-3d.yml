name: Format living 3D preview (temporary)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  formatter:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/living-3d-pet-behaviours-20261102'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/living-3d-pet-behaviours-20261102
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - name: Format only the feature files
        run: npx oxfmt app/layout.tsx app/living-cat.css components/living-cat.tsx components/shared.tsx components/tripo-pet.tsx lib/cat-motion.ts tests/animated-vignette.test.ts tests/cat-motion.test.ts
      - name: Commit formatting (same-repo branch only)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          git add app/layout.tsx app/living-cat.css components/living-cat.tsx components/shared.tsx components/tripo-pet.tsx lib/cat-motion.ts tests/animated-vignette.test.ts tests/cat-motion.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize 3D studio formatting with oxfmt'
            git push origin HEAD:feat/living-3d-pet-behaviours-20261102
          fi
