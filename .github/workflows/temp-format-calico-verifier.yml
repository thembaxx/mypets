name: One-time calico GLB verifier formatting
on:
  push:
    branches: [feat/living-3d-pet-behaviours-20261102]
    paths:
      - .github/workflows/temp-format-calico-verifier.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/living-3d-pet-behaviours-20261102
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npx oxfmt scripts/verify-calico-rig.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-calico-rig.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style: format multi-bone GLB skin verifier'
            git fetch origin feat/living-3d-pet-behaviours-20261102
            git rebase origin/feat/living-3d-pet-behaviours-20261102
            git push origin HEAD:feat/living-3d-pet-behaviours-20261102
          fi
