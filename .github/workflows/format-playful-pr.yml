name: One-time playful animal GLB verifier formatter
on:
  push:
    branches:
      - feat/playful-pets-video-reference-20261103
    paths:
      - '.github/workflows/format-playful-pr.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Apply pinned repository Oxfmt only to GLB verifier
        run: |
          set -euo pipefail
          npx oxfmt scripts/verify-species-rigs.mjs
          if git diff --quiet -- scripts/verify-species-rigs.mjs; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-species-rigs.mjs
          git commit -m 'style(3d): format playful facial GLB checks'
          git push origin HEAD:feat/playful-pets-video-reference-20261103
