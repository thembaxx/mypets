name: Temporary format calico review UI
on:
  push:
    branches: [feat/living-3d-pet-behaviours-20261102]
    paths: [.github/workflows/temp-format-calico-ui.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/living-3d-pet-behaviours-20261102
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npx oxfmt components/tripo-pet.tsx components/living-cat.tsx app/living-cat.css lib/validate-local-glb.ts tests/local-glb.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/tripo-pet.tsx components/living-cat.tsx app/living-cat.css lib/validate-local-glb.ts tests/local-glb.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize calico local review controls'
            git push origin HEAD:feat/living-3d-pet-behaviours-20261102
          fi
