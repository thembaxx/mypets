name: One-off formatter for Blender pipeline
on:
  push:
    branches: [feat/living-3d-pet-behaviours-20261102]
    paths: [.github/workflows/temp-format-blender-pipeline.yml]
permissions:
  contents: write
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/living-3d-pet-behaviours-20261102
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npx oxfmt .github/workflows/rigged-calico-candidate.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rigged-calico-candidate.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style(ci): format Blender candidate workflow'
            git push origin HEAD:feat/living-3d-pet-behaviours-20261102
          fi
