name: Species formatter diagnostic
on:
  push:
    branches:
      - feat/3d-all-animals-candidates-20261102
    paths:
      - .github/workflows/species-format-diagnostic.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Print exact formatting corrections
        run: |
          npx oxfmt app/3d-lab/page.tsx components/tripo-pet.tsx lib/species-3d.ts scripts/verify-species-rigs.mjs tests/species-3d.test.ts tests/species-browser.spec.mjs
          git diff -- app/3d-lab/page.tsx components/tripo-pet.tsx lib/species-3d.ts scripts/verify-species-rigs.mjs tests/species-3d.test.ts tests/species-browser.spec.mjs
