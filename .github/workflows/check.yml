name: Check Nuzzle
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify original-image-to-3D intake and batch tests
        run: |
          python3 -m compileall -q scripts/image3d_glb.py scripts/batch-image3d-blender.py scripts/import-image3d-blender.py
          python3 -m unittest scripts/test_image3d_glb.py scripts/test_batch_image3d.py -v
      - run: npm run build
