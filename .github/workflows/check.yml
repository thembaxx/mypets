name: Check Nuzzle
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: One-time formatter for the code-native cat review PR
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/pet-animation-framing-threejs-20261107'
        run: npm run format
      - name: Commit formatter output
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/pet-animation-framing-threejs-20261107'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format code-native cat review"
          git push
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
