name: Three.js r187 focused QA
on:
  pull_request:
    paths:
      - "components/tripo-pet.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/threejs-r187-qa.yml"
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx oxfmt --check components/tripo-pet.tsx
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:check
      - run: npm run build
