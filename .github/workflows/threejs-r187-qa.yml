name: Three.js r187 focused QA
on:
  push:
    branches:
      - main
    paths:
      - 'public/models/candidates/**'
      - 'components/tripo-pet.tsx'
      - 'tests/**'
      - '.github/workflows/threejs-r187-qa.yml'
  pull_request:
    paths:
      - 'components/tripo-pet.tsx'
      - 'app/3d-lab/**'
      - 'app/living-cat.css'
      - 'tests/calico-browser.spec.mjs'
      - 'tests/chibi-browser.spec.mjs'
      - 'tests/species-browser.spec.mjs'
      - 'tests/species-realism-browser.spec.mjs'
      - 'scripts/species_realism.py'
      - 'scripts/author-calico-rig.py'
      - 'scripts/calico_feline_sculpt.py'
      - 'scripts/calico_gait.py'
      - '.github/workflows/rigged-calico-candidate.yml'
      - 'scripts/author-species-rigs.py'
      - 'scripts/species_anatomy.py'
      - 'scripts/test_species_anatomy.py'
      - 'scripts/verify-species-rigs.mjs'
      - 'scripts/author-chibi-heroes.py'
      - 'scripts/verify-chibi-heroes.mjs'
      - 'lib/species-3d.ts'
      - '.github/workflows/chibi-heroes-review.yml'
      - 'public/models/candidates/**'
      - 'docs/avian-aquatic-visual-review.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/threejs-r187-qa.yml'
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx oxfmt --check components/tripo-pet.tsx
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:check
      - run: npm run build
      - run: npx --yes playwright@1.64.1 install --with-deps chromium
      - name: Mobile and desktop browser smoke
        run: |
          npm run start > "$RUNNER_TEMP/nuzzle-3d-preview.log" 2>&1 &
          curl --fail --silent --retry 30 --retry-delay 1 --retry-connrefused --max-time 2 http://127.0.0.1:3000/ > /dev/null
          npx --yes playwright@1.64.1 screenshot --browser chromium --viewport-size "390,844" --wait-for-timeout 1200 http://127.0.0.1:3000/ "$RUNNER_TEMP/nuzzle-mobile.png"
          npx --yes playwright@1.64.1 screenshot --browser chromium --viewport-size "1440,900" --wait-for-timeout 1200 http://127.0.0.1:3000/ "$RUNNER_TEMP/nuzzle-desktop.png"

      - name: Install isolated Playwright test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.64.1
      - name: Exercise real rigged cat in desktop and mobile browsers
        run: |
          curl --fail --silent --retry 30 --retry-delay 1 --retry-connrefused --max-time 2 http://127.0.0.1:3000/3d-lab/ > /dev/null
          mkdir -p test-results
          npx playwright test tests/calico-browser.spec.mjs tests/chibi-browser.spec.mjs tests/species-browser.spec.mjs tests/species-realism-browser.spec.mjs --reporter=line --workers=1
      - name: Install Safari WebKit browser runtime
        run: npx playwright install --with-deps webkit
      - name: Verify rigged cat interactions in Safari WebKit
        run: |
          npx playwright test tests/calico-browser.spec.mjs tests/chibi-browser.spec.mjs tests/species-browser.spec.mjs tests/species-realism-browser.spec.mjs --browser=webkit --reporter=line --workers=1

      - name: Upload cat action and facial animation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calico-webgl-interaction-review
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
