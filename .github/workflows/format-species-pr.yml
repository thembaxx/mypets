name: One-time species browser test format repair
on:
  push:
    branches:
      - feat/all-species-anatomy-contact-20261102
    paths:
      - '.github/workflows/format-species-pr.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Format changed browser test with pinned oxfmt
        run: |
          set -euo pipefail
          npx oxfmt tests/species-browser.spec.mjs
          git diff -- tests/species-browser.spec.mjs
          if git diff --quiet -- tests/species-browser.spec.mjs; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/species-browser.spec.mjs
          git commit -m 'style(test): apply repository oxfmt to GLB integrity checks'
          git push origin HEAD:feat/all-species-anatomy-contact-20261102
