name: One-time chibi prototype formatter
on:
  push:
    branches:
      - feat/playful-pets-video-reference-20261103
    paths:
      - '.github/workflows/format-chibi-pr.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Apply repository pinned Oxfmt to authored UI and test files
        run: |
          set -euo pipefail
          npx oxfmt app/3d-lab/page.tsx app/living-cat.css components/tripo-pet.tsx lib/species-3d.ts scripts/verify-chibi-heroes.mjs scripts/verify-species-rigs.mjs tests/chibi-browser.spec.mjs
          git diff --stat
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/3d-lab/page.tsx app/living-cat.css components/tripo-pet.tsx lib/species-3d.ts scripts/verify-chibi-heroes.mjs scripts/verify-species-rigs.mjs tests/chibi-browser.spec.mjs
          git commit -m 'style(3d): apply pinned Oxfmt to playful chibi studio'
          git push origin HEAD:feat/playful-pets-video-reference-20261103
