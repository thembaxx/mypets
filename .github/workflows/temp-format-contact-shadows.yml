name: One-time contact shadow formatting
on:
  push:
    branches: [feat/living-3d-pet-behaviours-20261102]
    paths:
      - .github/workflows/temp-format-contact-shadows.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/living-3d-pet-behaviours-20261102
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npx oxfmt components/tripo-pet.tsx
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/tripo-pet.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(3d): format ground shadows with oxfmt'
            git fetch origin feat/living-3d-pet-behaviours-20261102
            git rebase origin/feat/living-3d-pet-behaviours-20261102
            git push origin HEAD:feat/living-3d-pet-behaviours-20261102
          fi
