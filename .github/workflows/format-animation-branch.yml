name: One-time Nuzzle animation formatter
on:
  push:
    branches:
      - feat/playful-pets-static-toggle-20261021
    paths:
      - .github/workflows/format-animation-branch.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'thembaxx/mypets'
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx oxfmt .
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "style: format Nuzzle animation changes"
            git push
          fi
