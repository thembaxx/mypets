name: Temporary PR formatting pass
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/temporary-oxfmt.yml
      - app/3d-lab/page.tsx
      - app/globals.css
      - components/living-cat.tsx
      - lib/pet-camera.ts
      - lib/pet-coat-material.ts
      - lib/procedural-animal.ts
      - tests/pet-camera.test.ts
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pet-animation-framing-threejs-20261107
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply repository oxfmt formatting"
          git push
