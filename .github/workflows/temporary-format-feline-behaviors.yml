name: One-time format feline behavior milestone
on:
  push:
    branches: [feat/living-3d-pet-behaviours-20261102]
    paths:
      - .github/workflows/temporary-format-feline-behaviors.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/living-3d-pet-behaviours-20261102
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npx oxfmt lib/cat-motion.ts components/tripo-pet.tsx tests/cat-motion.test.ts tests/calico-browser.spec.mjs scripts/verify-calico-rig.mjs docs/living-animals-3d.md
      - name: Commit exact repository formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/cat-motion.ts components/tripo-pet.tsx tests/cat-motion.test.ts tests/calico-browser.spec.mjs scripts/verify-calico-rig.mjs docs/living-animals-3d.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(3d): apply oxfmt to feline grooming and sniffing controls'
            git fetch origin feat/living-3d-pet-behaviours-20261102
            git rebase origin/feat/living-3d-pet-behaviours-20261102
            git push origin HEAD:feat/living-3d-pet-behaviours-20261102
          fi
