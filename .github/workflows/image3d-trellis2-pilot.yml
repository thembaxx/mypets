# This is a deliberate one-shot review experiment; no automatic retries on
# source code changes (public shared GPUs have limited daily free quotas).
name: TRELLIS.2 source-conditioned cat (free GPU pilot)
on:
  # Manual-only. No additional public GPU calls from pushes, especially while
  # GitHub-hosted runners or the ZeroGPU daily quota are unavailable.
  workflow_dispatch:
    inputs:
      resume_from_run_id:
        description: "Optional earlier TRELLIS.2 run ID containing real generated latent checkpoint"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: image3d-trellis2-public-one-at-a-time
  cancel-in-progress: false

jobs:
  cat-source-conditioned:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      # Optional read-only Hugging Face token; when missing, anonymous tier.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install source preparation and public Gradio client
        run: |
          python -m pip install 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5' 'Pillow>=11,<13' 'gradio_client>=2,<3'
          python -m py_compile scripts/try-trellis2-pilot.py
          python -m unittest scripts/test_try_trellis2_pilot.py -v
      - name: Build original-character input, not generic synthetic geometry
        run: |
          python scripts/prepare-image3d-source.py \
            --original-dir assets/animal-originals \
            --output-dir "$RUNNER_TEMP/trellis2-source" \
            --species cat --size 1024
      - name: Recover provenance-bound GPU latents from selected earlier run
        if: ${{ inputs.resume_from_run_id != '' }}
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.resume_from_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid source run ID"; exit 1; }
          mkdir -p "$RUNNER_TEMP/trellis2-prior"
          gh run download "$SOURCE_RUN" \
            -n trellis2-cat-source-conditioned-review-unapproved \
            --dir "$RUNNER_TEMP/trellis2-prior"
          LATENTS=$(find "$RUNNER_TEMP/trellis2-prior" -type f \
            -name 'trellis2-cat-latents.npz' -print -quit)
          test -n "$LATENTS" || { echo "No genuine generated latent checkpoint in selected run"; exit 1; }
          echo "state=$LATENTS" >> "$GITHUB_OUTPUT"
      - name: Generate using free shared GPU or resume only GLB extraction
        env:
          LATENTS_PATH: ${{ steps.restore.outputs.state }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "$LATENTS_PATH" ]]; then
            ARGS+=(--resume-state "$LATENTS_PATH")
          fi
          python scripts/try-trellis2-pilot.py \
            --source "$RUNNER_TEMP/trellis2-source/cat.png" \
            --original assets/animal-originals/cat.jpg \
            --output-dir "$RUNNER_TEMP/trellis2-review" \
            --resolution 1024 --seed 42 "${ARGS[@]}"
      - name: Upload genuine generation output or explicit quota failure receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trellis2-cat-source-conditioned-review-unapproved
          path: |
            ${{ runner.temp }}/trellis2-review/
            ${{ runner.temp }}/trellis2-source/
          retention-days: 7
          if-no-files-found: warn
