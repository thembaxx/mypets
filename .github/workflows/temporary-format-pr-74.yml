name: Temporary PR 74 formatter
on:
  push:
    branches:
      - feat/glb-coat-shader-enhancement-20261107
permissions:
  contents: write
jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/glb-coat-shader-enhancement-20261107
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Format changed TypeScript files
        run: npx oxfmt components/tripo-pet.tsx lib/pet-coat-material.ts
      - name: Verify formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate 3D assets
        run: npm run assets:check
      - name: Production build
        run: npm run build
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            echo "Formatter produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tripo-pet.tsx lib/pet-coat-material.ts
          git commit -m "style: format 3D pet coat shader changes"
          git push origin HEAD:feat/glb-coat-shader-enhancement-20261107
